.cr-designer-inspector h4{margin:10px 0 4px;font-size:var(--cr-font-size-small);color:var(--cr-text-muted);
  text-transform:uppercase;letter-spacing:.04em}
.cr-designer-inspector h3{margin:0 0 2px;font-size:var(--cr-font-size)}
.cr-designer-row{display:grid;grid-template-columns:92px 1fr;gap:6px;align-items:center;margin:3px 0}
.cr-designer-row input[type=text],.cr-designer-row textarea{box-sizing:border-box;width:100%;min-width:0;
  font:var(--cr-font-size) var(--cr-font-ui);background:var(--cr-input-bg);color:var(--cr-text);
  border:1px solid var(--cr-buttonbar-border);padding:2px 4px}
.cr-designer-row textarea{font-family:var(--cr-font-code);resize:vertical}
.cr-designer-row label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-designer-hint{color:var(--cr-text-faint);font-size:var(--cr-font-size-small);margin:2px 0 6px}
.cr-designer-name{box-sizing:border-box;font:inherit;background:var(--cr-input-bg);color:var(--cr-text);
  border:1px solid var(--cr-buttonbar-border);padding:0 4px}
.cr-designer-preview:focus{outline:none}
.cr-designer-preview .cr-app-widgets{touch-action:none}
.cr-designer-select.cr-designer-also{outline-style:dashed}
.cr-designer-guide{position:absolute;pointer-events:none;z-index:99997;background:#e0457b;display:none}
.cr-designer-edit{position:absolute;z-index:100000;box-sizing:border-box;font:var(--cr-font-size) var(--cr-font-ui);
  background:var(--cr-input-bg);color:var(--cr-text);border:2px solid var(--cr-accent);padding:0 4px}
.cr-designer-output{position:absolute;left:0;right:0;bottom:0;max-height:35%;overflow:auto;z-index:99996;margin:0;
  padding:4px 8px;box-sizing:border-box;white-space:pre-wrap;font:var(--cr-font-size-small) var(--cr-font-code);
  background:var(--cr-window-bg);color:var(--cr-text);border-top:1px solid var(--cr-buttonbar-border);display:none}
.cr-designer-context{position:fixed;z-index:2147483646;min-width:170px;margin:0;padding:4px 0;list-style:none;
  background:var(--cr-window-bg);color:var(--cr-text);border:1px solid var(--cr-buttonbar-border);
  box-shadow:0 4px 16px rgba(0,0,0,.35);font:var(--cr-font-size) var(--cr-font-ui)}
.cr-designer-context li{padding:3px 14px;cursor:default;white-space:nowrap}
.cr-designer-context li:hover{background:var(--cr-accent);color:#fff}
.cr-designer-context li.cr-designer-off{color:var(--cr-text-faint);pointer-events:none}
.cr-designer-context li.cr-designer-line{height:1px;padding:0;margin:4px 0;background:var(--cr-buttonbar-border);pointer-events:none}
.cr-designer-missing input{border-color:#d9822b}
.cr-designer-missing label::after{content:' (new)';color:#d9822b}
@media (pointer:coarse){
  .cr-designer-grip{right:-12px;bottom:-12px;width:24px;height:24px;border-radius:12px}
  .cr-designer-context li{padding:9px 16px}
}

Board and the random functions are all built in.

Running a program
  Run, in a Python console, runs the program and shows what it prints in the
  Text tab of the output. A console has only a Board, a Canvas and a Physics
  to draw on, and it dims its output while a program runs. A program that makes
  any other widget (a Label, a Button, ...), or that you want to see in full
  colour, runs from the console's Launch menu: Desktop or Mobile, a window of
  that shape.

How a program runs
  The code at the left margin runs once, from the first line to the last. If it
  registered a handler (button.on_click(f), canvas.on_click(f), ...) the program
  then stays alive and calls the handler each time the event happens, until you
  press Reset or close its window. A program with no handlers ends when its
  last line has run. See "Events and handlers".

Output
  print(...) writes a line to the program's output. transcript(...) takes the
  same arguments but writes to the Transcript window instead.

Mistakes
  A mistake in the form of the program (a missing colon, a bad indent) is
  reported with its line number, all together, before anything runs.
  A mistake while it runs stops that program and reports the line and the chain
  of calls that led to it, for example:

.cr-html h1,.cr-html h2,.cr-html h3,.cr-html h4{margin:.8em 0 .4em;line-height:1.25}
.cr-html h1{font-size:1.4em}.cr-html h2{font-size:1.25em}.cr-html h3{font-size:1.1em}.cr-html h4{font-size:1em}
.cr-html ul,.cr-html ol{padding-left:1.6em}
.cr-html a{color:var(--cr-accent)}
.cr-html code{font:.95em var(--cr-font-code);background:var(--cr-output-bg);padding:1px 4px;border-radius:3px}
.cr-html pre{font:.95em/1.4 var(--cr-font-code);background:var(--cr-output-bg);padding:8px 10px;border:1px solid var(--cr-divider);
  border-radius:var(--cr-radius-button);overflow:auto;white-space:pre}
.cr-html pre code{background:none;padding:0}
.cr-html blockquote{border-left:3px solid var(--cr-divider);padding:2px 0 2px 10px;color:var(--cr-text-muted)}
.cr-html img{max-width:100%;height:auto}
.cr-html table{border-collapse:collapse}
.cr-html th,.cr-html td{border:1px solid var(--cr-divider);padding:3px 8px}
.cr-html th{background:var(--cr-header-bg)}
.cr-html hr{border:0;border-top:1px solid var(--cr-divider)}
.cr-html .thredded--post--content--spoiler{border:1px dashed var(--cr-divider);border-radius:4px;padding:4px 8px;
  margin:0 0 .7em;cursor:pointer}
.cr-html .thredded--post--content--spoiler--summary{color:var(--cr-text-muted);font-style:italic}
.cr-html .thredded--post--content--spoiler[aria-expanded="false"] .thredded--post--content--spoiler--contents{display:none}
.cr-html .thredded--post--content--spoiler[aria-expanded="true"] .thredded--post--content--spoiler--summary{display:none}
.cr-html-empty{color:var(--cr-text-faint)}
.cr-html-panel{background:var(--cr-input-bg)}
.cr-html-scroll{position:absolute;inset:0;overflow:auto;padding:8px 12px;box-sizing:border-box}

.cr-cards{position:absolute;inset:0;overflow:auto;box-sizing:border-box;padding:8px 10px 12px;
  background:var(--cr-window-bg);font:var(--cr-font-size) var(--cr-font-ui);color:var(--cr-text)}
.cr-cards-heading{font-size:1.25em;font-weight:600;margin:2px 2px 2px;overflow-wrap:anywhere}
.cr-cards-sub{color:var(--cr-text-muted);font-size:var(--cr-font-size-small);margin:0 2px 10px}
.cr-cards-empty{color:var(--cr-text-faint);padding:6px 2px}
.cr-card{background:var(--cr-input-bg);border:1px solid var(--cr-divider);border-radius:var(--cr-window-radius);
  padding:10px 12px;margin-bottom:8px;scroll-margin:8px}
.cr-card.cr-card-highlight{border-color:var(--cr-accent);box-shadow:0 0 0 1px var(--cr-accent)}
.cr-card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;min-width:0}
.cr-card-avatar{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:600;font-size:14px;overflow:hidden}
.cr-card-avatar img{width:100%;height:100%}
.cr-card-author{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-card-meta{color:var(--cr-text-muted);font-size:var(--cr-font-size-small);white-space:nowrap}
.cr-card-badge{font-size:11px;line-height:16px;padding:0 6px;border-radius:8px;white-space:nowrap;
  background:var(--cr-header-bg);color:var(--cr-text-muted);border:1px solid var(--cr-divider)}
.cr-card-badge.cr-tone-warning{background:#fff3cd;color:#7a5600;border-color:#e8c766}
.cr-card-badge.cr-tone-danger{background:#fde2e1;color:#9b1c1c;border-color:#efa8a5}
.cr-card-context{color:var(--cr-text-muted);font-size:var(--cr-font-size-small);margin:-2px 0 8px}
.cr-card-text{white-space:pre-wrap;overflow-wrap:anywhere}
.cr-card-actions{display:flex;flex-wrap:wrap;gap:2px 4px;margin:8px -6px -4px;padding-top:6px;
  border-top:1px solid var(--cr-divider)}
.cr-card-action{border:0;background:transparent;color:var(--cr-text-muted);font:var(--cr-font-size-small) var(--cr-font-ui);
  padding:2px 6px;border-radius:var(--cr-radius-button);cursor:pointer}
.cr-card-action:hover,.cr-card-action:focus-visible{background:var(--cr-button-hover);color:var(--cr-text)}
