# FastBlips local site: http://localhost:8080 -> /var/www/fastblips

<VirtualHost *:8080>
    ServerName localhost
    ServerAlias 127.0.0.1
    DocumentRoot /var/www/fastblips
    DirectoryIndex index.html

    <Directory /var/www/fastblips>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # ES modules and wasm need correct MIME types
    AddType text/javascript .js .mjs
    AddType application/wasm .wasm

    # Local dev: always serve the latest build
    <IfModule mod_headers.c>
        Header set Cache-Control "no-store"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/fastblips-local-error.log
    CustomLog ${APACHE_LOG_DIR}/fastblips-local-access.log combined
</VirtualHost>
